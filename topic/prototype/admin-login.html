<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>管理员登录 - 麦乐迪零食 · 管理后台</title>
<link rel="stylesheet" href="styles/common.css">
<style>
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0A1628 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  body::before, body::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.3;
    z-index: 0;
  }
  body::before {
    width: 480px; height: 480px;
    background: var(--primary);
    top: -120px; left: -120px;
  }
  body::after {
    width: 420px; height: 420px;
    background: var(--purple);
    bottom: -120px; right: -100px;
  }
  .login-wrap {
    display: flex;
    width: 960px;
    background: var(--bg-card);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    z-index: 1;
  }
  .login-brand {
    width: 480px;
    background: linear-gradient(135deg, #722ED1 0%, #B388FF 100%);
    color: #fff;
    padding: 60px 48px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .login-brand::before {
    content: "🥨";
    position: absolute;
    bottom: -60px;
    right: -40px;
    font-size: 240px;
    opacity: 0.12;
  }
  .brand-icon {
    width: 64px; height: 64px;
    background: rgba(255,255,255,0.2);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    margin-bottom: 24px;
    backdrop-filter: blur(10px);
  }
  .brand-title {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 12px;
    position: relative;
  }
  .brand-slogan {
    font-size: 14px;
    opacity: 0.85;
    line-height: 1.7;
    position: relative;
  }
  .brand-features {
    position: relative;
    margin-top: 32px;
  }
  .brand-features .feat {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    font-size: 14px;
    opacity: 0.9;
  }
  .brand-features .feat::before {
    content: "✓";
    width: 22px; height: 22px;
    background: rgba(255,255,255,0.25);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }
  .brand-version {
    position: relative;
    font-size: 12px;
    opacity: 0.7;
  }
  .login-form {
    flex: 1;
    padding: 56px 56px 48px;
    display: flex;
    flex-direction: column;
  }
  .login-logo {
    display: flex; align-items: center; gap: 10px;
    font-size: 18px; font-weight: 700; color: var(--primary);
    margin-bottom: 8px;
  }
  .login-logo .logo-icon {
    width: 36px; height: 36px;
    background: var(--primary-gradient);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #fff;
    box-shadow: var(--shadow-primary);
  }
  .login-sub {
    font-size: 13px;
    color: var(--text-tertiary);
    margin-bottom: 28px;
  }
  .tab-row {
    display: flex;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
    gap: 24px;
  }
  .tab-row .tab {
    padding: 10px 0;
    font-size: 14px;
    color: var(--text-secondary);
    cursor: pointer;
    position: relative;
    transition: color 0.2s;
  }
  .tab-row .tab:hover { color: var(--primary); }
  .tab-row .tab.active {
    color: var(--primary);
    font-weight: 600;
  }
  .tab-row .tab.active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: var(--primary-gradient);
    border-radius: 2px;
  }
  .form-item .input-wrap {
    position: relative;
  }
  .form-item .input-wrap .ico {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    color: var(--text-tertiary);
  }
  .form-item .input-wrap input {
    padding-left: 40px;
    height: 44px;
  }
  .captcha-row {
    display: flex;
    gap: 12px;
  }
  .captcha-row .input-wrap { flex: 1; }
  .captcha-row .img-code {
    width: 110px; height: 44px;
    border-radius: 8px;
    background: linear-gradient(45deg, #FF6B35, #B388FF, #1890FF);
    color: #fff;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 4px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono);
    cursor: pointer;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
    user-select: none;
  }
  .row-between {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--text-secondary);
    margin: 16px 0 24px;
  }
  .row-between label {
    display: flex; align-items: center; gap: 6px;
    cursor: pointer;
  }
  .row-between a:hover { color: var(--primary); }
  .submit-btn {
    height: 46px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 8px;
  }
  .login-footer {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px dashed var(--border-light);
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-tertiary);
  }
  .login-footer a:hover { color: var(--primary); }
  .quick-fill {
    margin-top: 12px;
    padding: 10px 12px;
    background: var(--primary-bg);
    border-radius: 8px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.7;
  }
  .quick-fill b { color: var(--primary); }
</style>
</head>
<body>

<div class="login-wrap">
  <!-- 左侧品牌区 -->
  <div class="login-brand">
    <div>
      <div class="brand-icon">🥨</div>
      <div class="brand-title">麦乐迪管理后台</div>
      <div class="brand-slogan">
        一站式零食电商运营平台<br>
        高效、智能、专业的商家工作台
      </div>
      <div class="brand-features">
        <div class="feat">商品 / 订单 / 库存 全链路管理</div>
        <div class="feat">实时数据看板，决策有据可依</div>
        <div class="feat">多重权限隔离，安全合规</div>
      </div>
    </div>
    <div class="brand-version">© 2026 麦乐迪科技 · V2.6.1</div>
  </div>

  <!-- 右侧表单 -->
  <div class="login-form">
    <div class="login-logo">
      <span class="logo-icon">🥨</span>
      <span>麦乐迪零食 · 管理后台</span>
    </div>
    <div class="login-sub">请使用管理员账号登录系统</div>

    <div class="tab-row">
      <div class="tab active">账号密码登录</div>
      <div class="tab">验证码登录</div>
    </div>

    <div class="form-item">
      <div class="input-wrap">
        <span class="ico">👤</span>
        <input class="form-input" type="text" placeholder="请输入用户名 / 邮箱" value="admin">
      </div>
    </div>

    <div class="form-item">
      <div class="input-wrap">
        <span class="ico">🔒</span>
        <input class="form-input" type="password" placeholder="请输入登录密码" value="••••••••">
      </div>
    </div>

    <div class="form-item">
      <div class="captcha-row">
        <div class="input-wrap">
          <span class="ico">🛡️</span>
          <input class="form-input" type="text" placeholder="请输入验证码" value="A7K9">
        </div>
        <div class="img-code">A7K9</div>
      </div>
    </div>

    <div class="row-between">
      <label><input type="checkbox" checked> 记住我 7 天</label>
      <a href="#">忘记密码？</a>
    </div>

    <button class="btn btn-primary btn-block submit-btn">登 录</button>

    <div class="quick-fill">
      <b>演示账号：</b>admin / admin123　　<b>角色：</b>超级管理员
    </div>

    <div class="login-footer">
      <span>© 2026 麦乐迪科技 · 备案号 京 ICP 备 0000000 号</span>
      <a href="home.html">← 返回前台</a>
    </div>
  </div>
</div>

</body>
</html>
